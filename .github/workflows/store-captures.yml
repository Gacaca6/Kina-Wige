name: Store captures

# Raw screenshots for the Google Play listing and the launch campaign.
# Builds the debug app, drives it in an emulator into each marketing screen,
# and uploads full-resolution PNGs. Framing happens afterwards with goldie.
# Runs only on the separate `marketing` branch, never on main, and nothing
# here ships in the app.

on:
  push:
    branches: [marketing]
    paths:
      - "scripts/marketing/**"
      - ".github/workflows/store-captures.yml"
  workflow_dispatch:

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Native build, copy into the Android project
        run: npm run android:sync

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Install capture dependency
        run: python3 -m pip install --user websocket-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 scripts/marketing/store-captures.py android/app/build/outputs/apk/debug/app-debug.apk store-raw

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-raw
          path: store-raw
          retention-days: 14
