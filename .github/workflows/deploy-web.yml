name: Deploy web app

# Publishes the website/PWA build to Cloudflare Pages project `kinawige-app`
# (https://kinawige-app.pages.dev) on every push to main, with functions/
# (byte ranges for /videos/*). The Android app is not affected: it carries its
# own copy and never loads anything from here.
#
# The same Cloudflare account also holds the owner's separate Wayfind
# project. This workflow must only ever touch the Pages project named below:
# never `wrangler deploy` (Workers), which would deploy by Worker name.
#
# Needs two repository secrets, created by the owner (never pasted in chat):
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  c2f20a67cc8afab4288db38ead695fe0
# Without them the job builds and checks but skips the deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build (runs the i18n, curriculum and assessment checks first)
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (kinawige-app only)
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name kinawige-app --branch main

      - name: No token yet
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so the build was checked but not deployed."
