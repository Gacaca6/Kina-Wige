<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F5F0E6;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="65.411"
      data-width="1920"
      data-height="1080"
    >
      <!-- Six vowel frames stitched end to end (spans from STORYBOARD.md) -->
      <div class="clip" data-composition-id="01-f1" data-composition-src="compositions/frames/01-f1.html"
           data-start="0"     data-duration="11.91"  data-track-index="0"></div>
      <div class="clip" data-composition-id="02-f2" data-composition-src="compositions/frames/02-f2.html"
           data-start="11.91" data-duration="11.59"  data-track-index="0"></div>
      <div class="clip" data-composition-id="03-f3" data-composition-src="compositions/frames/03-f3.html"
           data-start="23.5"  data-duration="11.4"   data-track-index="0"></div>
      <div class="clip" data-composition-id="04-f4" data-composition-src="compositions/frames/04-f4.html"
           data-start="34.9"  data-duration="11.61"  data-track-index="0"></div>
      <div class="clip" data-composition-id="05-f5" data-composition-src="compositions/frames/05-f5.html"
           data-start="46.51" data-duration="11.15"  data-track-index="0"></div>
      <div class="clip" data-composition-id="06-f6" data-composition-src="compositions/frames/06-f6.html"
           data-start="57.66" data-duration="7.751"  data-track-index="0"></div>

      <!-- Soundtrack: the Kinyarwanda vowels song (full length) -->
      <audio id="bgm" class="clip" src="assets/bgm.mp3"
             data-start="0" data-duration="65.411" data-track-index="9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // The root is a pure container — each frame drives its own paused timeline.
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
