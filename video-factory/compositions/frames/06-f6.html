        const CUT = 4.34;
        const END = 7.751;

        /* ---------- group visibility (0ms group→group cut) ---------- */

        tl.set("#g2", { autoAlpha: 0 }, 0);
        tl.set("#g1", { autoAlpha: 0 }, CUT);

        /* ---------- g1 · vowel cascade, one per beat anchor ----------
           Track anchors 58 / 59 / 60 / 61 → local 0.34 / 1.34 / 2.34 / 3.34.
           The fifth anchor (track 62 = local 4.34) collides with the hard cut,
           so U slams in just ahead of it and settles exactly on the stop. */
        const vowels = ["#g1_vA", "#g1_vI", "#g1_vE", "#g1_vO", "#g1_vU"];
        const anchors = [0.34, 1.34, 2.34, 3.34, 3.99];

        vowels.forEach((sel, i) => {
          tl.fromTo(
            sel,
            { y: -170, scale: 0.2, rotation: i % 2 === 0 ? -8 : 8, opacity: 0 },
            {
              y: 0,
              scale: 1,
              rotation: 0,
              opacity: 1,
              duration: 0.42,
              ease: "back.out(2.2)",
            },
            anchors[i],
          );
        });

        /* each new landing makes the already-landed letters do a tiny happy bounce */
        for (let i = 1; i < vowels.length; i++) {
          for (let j = 0; j < i; j++) {
            tl.to(vowels[j], { scale: 1.07, duration: 0.13, ease: "power2.out" }, anchors[i]);
            tl.to(vowels[j], { scale: 1.0, duration: 0.22, ease: "back.out(3)" }, anchors[i] + 0.13);
          }

        /* ---------- g1 · pastel confetti on the 60-62 HIGH ----------
           Deterministic golden-angle bursts (particle-burst recipe) at
           local 2.34 (track 60 SURGE) and local 3.34 (track 61). */

        const N = 56; // 28 per burst
        const holder = document.getElementById("g1_confetti");
        const dots = [];
        for (let i = 0; i < N; i++) {
          const d = document.createElement("div");
          d.className = "g1_dot";
          const sz = 12 + (i % 4) * 5;
          d.style.width = sz + "px";
          d.style.height = sz + "px";
          d.style.background = pastels[i % pastels.length];
          holder.appendChild(d);
          dots.push(d);
        }
        const burstStarts = [2.34, 3.34];
        dots.forEach((d, i) => {
          const burst = i < 28 ? 0 : 1;
          const k = i % 28;
          const angle = (k / 28) * Math.PI * 2 + k * 0.137; // golden-angle jitter
          const radius = 330 + (k % 5) * 105 + (k % 3) * 48;
          const tx = Math.cos(angle) * radius;
          const ty = Math.sin(angle) * radius * 0.62; // flatten to frame
          const dur = 0.9 + (k % 5) * 0.07;
          tl.fromTo(
            d,
            { x: 0, y: 0, scale: 1, opacity: 1 },
            { x: tx, y: ty, scale: 0, opacity: 0, duration: dur, ease: "expo.out" },
            burstStarts[burst] + (k % 6) * 0.012,
