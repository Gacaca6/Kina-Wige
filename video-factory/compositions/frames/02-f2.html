        (function () {

          var CUT = 5.09; // g1 → g2 cut, frame-local (track 17.0 HIGH spike)

          /* ── deterministic pastel confetti dots (round, outlined, no flashes) ── */
          var PALETTE = ["#7ECDC0", "#FDE68A", "#A8E6CF", "#D4A5E8", "#FFCBA4", "#A8D8F0", "#F8635F", "#FFFFFF"];
          var NB = 30;
          var confetti = document.getElementById("g2_confetti");
          var dots = [];
          for (var i = 0; i < NB; i++) {
            var p = document.createElement("div");
            p.className = "dot";
            var sz = 16 + (i % 4) * 5;
            p.style.width = sz + "px";
            p.style.height = sz + "px";
            p.style.left = -sz / 2 + "px";
            p.style.top = -sz / 2 + "px";
            p.style.background = PALETTE[i % PALETTE.length];
            confetti.appendChild(p);
            dots.push(p);
          }

          /* ════ t = 0 initial states (seek-safe) ════ */
          tl.set("#g1", { autoAlpha: 1 }, 0);
          tl.set("#g2", { autoAlpha: 0 }, 0);
          tl.set("#g1_I, #g1_i", { autoAlpha: 0 }, 0);
          tl.set("#g1_ring", { autoAlpha: 0 }, 0);
          tl.set("#g2_hirwa", { autoAlpha: 0 }, 0);
          tl.set(dots, { autoAlpha: 0 }, 0);

          /* helper: even-iteration yoyo sway that ends at its start pose */
          function sway(el, base, amp, dur, start, windowLen) {
            var n = Math.floor(windowLen / dur);
            if (n % 2) n--;
            if (n < 2) n = 2;
            tl.fromTo(
              el,
              { rotation: base - amp },
              { rotation: base + amp, duration: dur, yoyo: true, repeat: n - 1, ease: "sine.inOut" },
              start
            );
          }

          /* ════ g1 · [0 → 5.09] vowel I slam ════ */

          // bg-flow-field (pastel realization): blobs drift slowly across the group span
          var g1blobs = document.querySelectorAll("#g1 .blob");
          g1blobs.forEach(function (b, i) {
            var dx = (i % 2 ? -1 : 1) * (20 + (i % 3) * 12);
            var dy = (i % 3 ? 1 : -1) * (16 + (i % 2) * 14);
            var rot = (i % 2 ? -1 : 1) * (4 + (i % 3) * 2);
            tl.fromTo(b, { x: 0, y: 0, rotation: 0 }, { x: dx, y: dy, rotation: rot, duration: CUT, ease: "sine.inOut" }, 0);
          });

          // ornament idle sway
          var g1baseRot = [-12, 8, 0, -6, 10];
          document.querySelectorAll("#g1 .g1orn").forEach(function (o, i) {
            sway(o, g1baseRot[i], 3, 1.0 + (i % 3) * 0.25, 0, 5.0);
          });

          // letter slam @ 0.09 (track 12.0) — braam-punch stamp + kinetic-letter-in drop
          tl.fromTo("#g1_ring", { scale: 0.3, autoAlpha: 0.9 }, { scale: 1.35, autoAlpha: 0, duration: 0.6, ease: "power2.out" }, 0.09);
          tl.fromTo("#g1_I", { scale: 2.3, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "power4.out" }, 0.09);
          tl.fromTo("#g1_i", { y: 150, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(2.2)" }, 0.25);

          // soft squash settle on the pair

          tl.to("#g1_pair", { scaleY: 1, duration: 0.45, ease: "elastic.out(1, 0.5)" }, 0.59);

          // gentle pulses @ 1.09 / 3.09 (track 13.0 / 15.0)
          tl.to("#g1_pair", { scale: 1.05, duration: 0.2, ease: "sine.out" }, 1.09);
          tl.to("#g1_pair", { scale: 1, duration: 0.4, ease: "sine.inOut" }, 1.29);
          tl.to("#g1_pair", { scale: 1.05, duration: 0.2, ease: "sine.out" }, 3.09);
          tl.to("#g1_pair", { scale: 1, duration: 0.4, ease: "sine.inOut" }, 3.29);

          /* ════ 0ms group cut @ 5.09 (track 17.0 HIGH) ════ */
          tl.set("#g1", { autoAlpha: 0 }, CUT);
          tl.set("#g2", { autoAlpha: 1 }, CUT);

          /* ════ g2 · [5.09 → 11.59] held I + Hirwa celebrates ════ */

          // blobs keep drifting, easing to stillness by 9.09 (track 21.0 VOID)
          var g2blobs = document.querySelectorAll("#g2 .blob");
          g2blobs.forEach(function (b, i) {
            var dx = (i % 2 ? 1 : -1) * (14 + (i % 3) * 10);
            var dy = (i % 3 ? -1 : 1) * (12 + (i % 2) * 10);
            var rot = (i % 2 ? 1 : -1) * (3 + (i % 3) * 2);
            tl.fromTo(b, { x: 0, y: 0, rotation: 0 }, { x: dx, y: dy, rotation: rot, duration: 4.0, ease: "sine.out" }, CUT);
          });

          // ornament sway, all settled before 9.09
          var g2baseRot = [6, -10, 0, 8, -5];
          document.querySelectorAll("#g2 .g2orn").forEach(function (o, i) {
            sway(o, g2baseRot[i], 3, 1.0 + (i % 3) * 0.25, CUT, 3.9);
          });

          // held letters bounce happily on the spike
          tl.to("#g2_pair", { scale: 1.1, duration: 0.16, ease: "power2.out" }, CUT);
          tl.to("#g2_pair", { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.45)" }, CUT + 0.16);

          // hirwa pops bottom-left (overlay-pop) @ 5.09
          tl.fromTo(
            "#g2_hirwa",
            { scale: 0, y: 60, autoAlpha: 0 },
            { scale: 1, y: 0, autoAlpha: 1, duration: 0.65, ease: "back.out(1.6)" },
            CUT
          );
          // gentle bob, ending back at rest well before the 9.09 settle
          tl.to("#g2_hirwa", { y: -14, duration: 0.4, yoyo: true, repeat: 5, ease: "sine.inOut" }, 5.9);

          // soft pastel confetti burst (particle-burst, rounded + slowed, no flash)
          dots.forEach(function (p, i) {
            var angle = (i / NB) * Math.PI * 2 + i * 0.137;
            var radius = 240 + (i % 5) * 75 + (i % 3) * 45;
            var tx = Math.cos(angle) * radius;
            var ty = Math.sin(angle) * radius * 0.85 - 70;
            var d = 1.1 + (i % 5) * 0.09;
            var t0 = 5.12 + (i % 6) * 0.025;
            tl.set(p, { autoAlpha: 1 }, t0);
            tl.fromTo(p, { x: 0, y: 0, scale: 0.4 }, { x: tx, y: ty, scale: 1, duration: d, ease: "power2.out" }, t0);
            tl.fromTo(p, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.5, ease: "power1.in" }, t0 + d - 0.5);
          });

          // last gentle pulse @ 7.09 (track 19.0), then everything holds still 9.09 → 11.59
          tl.to("#g2_pair", { scale: 1.04, duration: 0.22, ease: "sine.out" }, 7.09);
          tl.to("#g2_pair", { scale: 1, duration: 0.44, ease: "sine.inOut" }, 7.31);
