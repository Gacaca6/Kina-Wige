      <script>
        (function () {
          window.__timelines = window.__timelines || {};
          var R = document.querySelector('[data-composition-id="03-f3"]');
          var $ = function (id) {
            return R.querySelector("#" + id);
          };
          var DUR = 11.4; // frame span length (34.9 − 23.5)
          var tl = gsap.timeline({ paused: true });

          var g1 = $("f3_g1"),
            g2 = $("f3_g2"),
            g1hero = $("f3_g1_hero"),
            g1fill = $("f3_g1_fill"),
            g1shadow = $("f3_g1_shadow"),
            g1pulse = $("f3_g1_pulse"),
            g2hero = $("f3_g2_hero"),
            g2pulse = $("f3_g2_pulse"),
            shake = $("f3_g2_shake"),
            keza = $("f3_g2_keza"),
            burst1 = $("f3_g2_burst1"),
            burst2 = $("f3_g2_burst2");

          // ── group visibility: 0ms group→group cut at local 6.5 (track 30.0) ──
          tl.set(g1, { autoAlpha: 1 }, 0);
          tl.set(g2, { autoAlpha: 0 }, 0);
          tl.set(burst1, { autoAlpha: 0 }, 0);
          tl.set(burst2, { autoAlpha: 0 }, 0);
          tl.set(g1, { autoAlpha: 0 }, 6.5);
          tl.set(g2, { autoAlpha: 1 }, 6.5);

          // ── scene bed: blob field drifts the whole frame (deterministic single tweens) ──
          var blobs = R.querySelectorAll(".blob");
          var drift = [
            { x: 40, y: 24, scale: 1.05 },
            { x: -50, y: 30, scale: 1.04 },
            { x: 36, y: -26, scale: 1.06 },
            { x: -30, y: -20, scale: 1.07 },
          ];
          blobs.forEach(function (b, i) {
            var d = drift[i % drift.length];
            tl.to(b, { x: d.x, y: d.y, scale: d.scale, duration: DUR, ease: "sine.inOut" }, 0);
          });

          // ornaments bob gently; finite yoyo repeats sized to fill 11.4s exactly
          var orns = R.querySelectorAll(".orn");
          var obDur = [1.9, 2.28, 1.425, 2.85, 1.9, 2.28];
          orns.forEach(function (el, i) {
            var d = obDur[i % obDur.length];
            var rep = Math.max(0, Math.round(DUR / d) - 1);
            tl.to(
              el,
              {
                y: i % 2 ? -10 : 9,
                rotation: i % 2 ? 4 : -4,
                duration: d,
                ease: "sine.inOut",
                yoyo: true,
                repeat: rep,
              },
              0,
            );
          });

          // gentle beat pulse helper (letters breathe on the grid — soft, 3-6yo audience)
          function pulse(el, t, amt) {
            tl.to(el, { scale: amt, duration: 0.12, ease: "power2.out" }, t);
            tl.to(el, { scale: 1, duration: 0.3, ease: "power2.inOut" }, t + 0.12);
          }

          // ═══ g1 — letter slam (braam-punch, soft/no-strobe) at local 0 (track 23.5) ═══
          tl.fromTo(
            g1hero,
            { scale: 0.55, autoAlpha: 0 },
            { scale: 1.14, autoAlpha: 1, duration: 0.18, ease: "power3.out" },
            0,
          );
          tl.to(g1hero, { scale: 1, duration: 0.85, ease: "elastic.out(1, 0.45)" }, 0.18);
          tl.fromTo(
            g1pulse,
            { scale: 0.5, autoAlpha: 0.9 },
            { scale: 1.55, autoAlpha: 0, duration: 0.7, ease: "power2.out" },
            0.03,
          );

          // beat pulses (track beats 24.961 / 26.192 downbeat / 26.912 → local)
          pulse(g1hero, 1.461, 1.04);
          pulse(g1hero, 2.692, 1.05);
          pulse(g1hero, 3.412, 1.035);

          // outline→fill resolve at local 4.5 (track 28.0 phase edge): butter fill rises,
          // hard offset shadow lands with it
          tl.fromTo(
            g1fill,
            { clipPath: "inset(100% 0% 0% 0%)" },
            { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "expo.out" },
            4.5,
          );
          tl.fromTo(g1shadow, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 4.62);
          tl.to(g1hero, { scale: 1.06, duration: 0.14, ease: "power3.out" }, 4.5);
          tl.to(g1hero, { scale: 1, duration: 0.55, ease: "elastic.out(1, 0.55)" }, 4.64);
          tl.fromTo(
            g1pulse,
            { scale: 0.6, autoAlpha: 0.7 },
            { scale: 1.45, autoAlpha: 0, duration: 0.6, ease: "power2.out" },
            4.5,
          );
          pulse(g1hero, 5.595, 1.04); // downbeat 29.095

          // ═══ g2 — held letter + THE peak celebration (track 31.0, energy 0.95) ═══
          pulse(g2hero, 7.034, 1.035); // beat 30.534 building in

          // 7.5: letter hits big + butter pulse ring
          tl.to(g2hero, { scale: 1.09, duration: 0.14, ease: "power3.out" }, 7.5);
          tl.to(g2hero, { scale: 1, duration: 0.7, ease: "elastic.out(1, 0.5)" }, 7.64);
          tl.fromTo(
            g2pulse,
            { scale: 0.5, autoAlpha: 0.9 },
            { scale: 1.7, autoAlpha: 0, duration: 0.8, ease: "power2.out" },
            7.5,
          );

          // keza pops bottom-right (overlay-pop: back.out overshoot)
          tl.fromTo(
            keza,
            { scale: 0, autoAlpha: 0, rotation: -16 },
            {
              scale: 1,
              autoAlpha: 1,
              rotation: -5,
              duration: 0.55,
              ease: "back.out(1.8)",
              transformOrigin: "50% 85%",
            },
            7.5,
          );

          // ONE soft playful bounce-shake (screen-shake, small amplitude, never aggressive)
          tl.to(shake, { y: 14, duration: 0.1, ease: "power2.out" }, 7.52);
          tl.to(shake, { y: -9, duration: 0.13, ease: "power1.inOut" }, 7.62);
          tl.to(shake, { y: 4, duration: 0.13, ease: "power1.inOut" }, 7.75);
          tl.to(shake, { y: 0, duration: 0.35, ease: "elastic.out(1, 0.6)" }, 7.88);

          // pastel confetti (particle-burst): deterministic golden-angle spread, outlined
          // pastel dots + strips, no flashes
          var CF_COLORS = ["#7ECDC0", "#F7C8D4", "#A8E6CF", "#D4A5E8", "#FFCBA4", "#A8D8F0", "#FFFFFF"];
          function burst(container, n, t, rBase) {
            for (var i = 0; i < n; i++) {
              var p = document.createElement("div");
              p.className = "cf";
              var strip = i % 3 === 0;
              var sz = 12 + (i % 4) * 5;
              p.style.background = CF_COLORS[i % CF_COLORS.length];
              if (strip) {
                p.style.width = "10px";
                p.style.height = "20px";
                p.style.borderRadius = "5px";
                p.style.margin = "-10px 0 0 -5px";
              } else {
                p.style.width = sz + "px";
                p.style.height = sz + "px";
                p.style.borderRadius = "50%";
                p.style.margin = -sz / 2 + "px 0 0 " + -sz / 2 + "px";
              }
              container.appendChild(p);
              var ang = (i / n) * Math.PI * 2 + i * 0.137;
              var rad = rBase + (i % 5) * 95 + (i % 3) * 55;
              var tx = Math.cos(ang) * rad;
              var ty = Math.sin(ang) * rad - 90; // slight upward lift
              var dur = 1.15 + (i % 5) * 0.09;
              tl.fromTo(
                p,
                { x: 0, y: 0, scale: 1, autoAlpha: 1, rotation: (i * 53) % 180 },
                {
                  x: tx,
                  y: ty,
                  scale: 0.25,
                  autoAlpha: 0,
                  rotation: ((i * 53) % 180) + (i % 2 ? 200 : -200),
                  duration: dur,
                  ease: "expo.out",
                },
                t + (i % 6) * 0.015,
              );
            }
          }
          tl.set(burst1, { autoAlpha: 1 }, 7.5);
          burst(burst1, 48, 7.5, 300);
          tl.set(burst1, { autoAlpha: 0 }, 9.4);

          // second, smaller sprinkle on the downbeat (track 31.974 → local 8.474)
          pulse(g2hero, 8.474, 1.05);
          tl.set(burst2, { autoAlpha: 1 }, 8.474);
          burst(burst2, 26, 8.474, 220);
          tl.set(burst2, { autoAlpha: 0 }, 10.3);

          // riding the HIGH: soft pulses on beats 32.717 / 33.46, settling by 34.0
          pulse(g2hero, 9.217, 1.03);
          pulse(g2hero, 9.96, 1.025);

          // keza bobs gently, resting by 10.8 for the settle into the cut
          tl.to(keza, { y: -12, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 8.4);

          window.__timelines["03-f3"] = tl;
          tl.seek(0);
        })();
      </script>
