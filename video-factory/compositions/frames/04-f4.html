      <script>

        const tl = gsap.timeline({ paused: true });

        tl.set("#g2_root", { autoAlpha: 0 }, 0);
        tl.set(["#g2_spark1", "#g2_spark2"], { autoAlpha: 0 }, 0);
        tl.set("#g1_root", { autoAlpha: 0 }, 7.1);
        tl.set("#g2_root", { autoAlpha: 1 }, 7.1);

        /* ═══ g1 · calm verse [0 → 7.1] ═══ */

        /* iris reveal — the O is a circle, so the mask is one (track 35.0 = local 0.1) */

        tl.to(

        tl.fromTo(

          { scale: 0.9 },
          { scale: 1, duration: 1.1, ease: "sine.out" },

        /* gentle letter pulses on the frame's downbeats (track 37.802, 40.681) */

          tl.to("#g1_hero", { scale: 1, duration: 0.3, ease: "sine.inOut" }, t + 0.16);

        /* rings breathe slowly through the LOW stretch — finite repeats, end well before the freeze */
        ["#bg_ring1", "#bg_ring2", "#bg_ring3"].forEach((id, i) => {
          tl.fromTo(
            id,

              scale: 1.05 - i * 0.008,
              duration: 1.451, /* two beats at 83.4 BPM */
              ease: "sine.inOut",
              yoyo: true,
              repeat: 3, /* 4 legs → ends at scale 1 */
            },
            0.4 + i * 0.484

        });

        /* blob field — one slow deterministic drift each, all done before the freeze */
        [
          { id: "#bg_blob1", dx: 26, dy: -20 },
          { id: "#bg_blob2", dx: -22, dy: 16 },
          { id: "#bg_blob3", dx: 20, dy: -26 },
          { id: "#bg_blob4", dx: -26, dy: -14 },
          { id: "#bg_blob5", dx: 14, dy: 18 },
          { id: "#bg_blob6", dx: -16, dy: -18 },

          tl.fromTo(
            b.id,
            { x: 0, y: 0 },
            { x: b.dx, y: b.dy, duration: 8.0, ease: "sine.inOut" },
            0.3 + i * 0.1

        /* ═══ g2 · lift, freeze, release [7.1 → 11.61] ═══ */

        /* overlay-pop — hirwa pops bottom-left on the 42.0 lift (local 7.1) */

          "#g2_hirwa",
          { scale: 0, y: 40, rotation: -6 },
          { scale: 1, y: 0, rotation: 0, duration: 0.55, ease: "back.out(1.6)" },

        /* gentle bob — odd leg count so the 9.1 freeze catches hirwa mid-hop */
        tl.fromTo(
          "#g2_hirwa",
          { y: 0 },
          { y: -16, duration: 0.28, ease: "sine.inOut", yoyo: true, repeat: 4 },
          7.7

        /* held letter pulse on the 43.607 downbeat (local 8.707), done before the freeze */
        tl.to("#g2_hero", { scale: 1.04, duration: 0.14, ease: "power2.out" }, 8.707);
        tl.to("#g2_hero", { scale: 1, duration: 0.24, ease: "sine.inOut" }, 8.847);

        /* freeze-hold — hard_stop at track 44.0 (local 9.1): NO tweens live in [9.1, 11.1].

        tl.set("#g2_hirwa", { rotation: 4 }, 9.1);
        tl.set(["#g2_spark1", "#g2_spark2"], { autoAlpha: 1 }, 9.1);

        /* release — track 46.0 (local 11.1): everything wakes with one happy bounce */
        tl.to("#g2_hirwa", { y: 0, rotation: 0, duration: 0.42, ease: "bounce.out" }, 11.1);
        tl.to("#g2_hero", { scale: 1.06, duration: 0.16, ease: "power2.out" }, 11.1);
        tl.to("#g2_hero", { scale: 1, duration: 0.3, ease: "sine.inOut" }, 11.26);
        tl.to(["#g2_spark1", "#g2_spark2"], { autoAlpha: 0, duration: 0.28, ease: "power1.in" }, 11.12);

          { scale: 1 },
          { scale: 1.045, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 },
